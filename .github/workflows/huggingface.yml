# Mirrors this repo to a Hugging Face Docker Space on every push to main.
# Only runs once you set the repository variable HF_SPACE (e.g. yourname/hivemind)
# and the repository secret HF_TOKEN (a Hugging Face token with write access).
name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.HF_SPACE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/space"
          mkdir -p "$out"
          cp -r hive requirements.txt Dockerfile "$out/"
          cat > "$out/README.md" <<EOF
          ---
          title: HIVEMIND
          emoji: 🐝
          colorFrom: yellow
          colorTo: gray
          sdk: docker
          app_port: 8000
          pinned: false
          ---

          HIVEMIND dashboard. Source: https://github.com/${GITHUB_REPOSITORY}
          EOF
          cd "$out"
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
